<!doctype html>
<html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#14283F"><title>Tu invitación · Turnia</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"></head>
<body><main class="panel recovery-panel"><img src="icon.svg" width="50" height="50" alt="Turnia"><p class="eyebrow spaced">BIENVENIDO A TURNIA</p><h1>Confirma tu invitación</h1><p id="invitationStatus" class="notice info" role="status" aria-live="polite">Comprobando tu enlace…</p>
<form id="confirmCode" class="hide"><label for="invitationCode">Código de invitación</label><input id="invitationCode" required minlength="64" maxlength="64" autocomplete="one-time-code"><p class="state-text">El enlace trae tu código. Confírmalo para continuar con tu cuenta.</p><button class="spaced" type="submit">Confirmar código y continuar →</button></form>
<form id="createInvitationAccount" class="hide"><h2 id="accountTitle">Crea tu cuenta</h2><label for="invitationEmail">Correo autorizado</label><input id="invitationEmail" type="email" readonly><div id="newAccountFields"><label class="spaced" for="invitationName">Tu nombre</label><input id="invitationName" minlength="2" maxlength="100" autocomplete="name"><label class="spaced" for="invitationPassword">Crea tu contraseña</label><input id="invitationPassword" type="password" minlength="8" autocomplete="new-password"><label class="spaced" for="invitationPasswordConfirm">Repite la contraseña</label><input id="invitationPasswordConfirm" type="password" minlength="8" autocomplete="new-password"></div><button id="finishInvitation" type="submit" class="spaced">Crear cuenta y entrar a Turnia →</button></form>
<p class="spaced"><a href="/">Volver a Turnia</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script src="invitacion.js?v=1"></script></body></html>
