name: Validación de Turnia
on:
  push:
    branches: [main, "improvement/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Sintaxis y flujos de usuario
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencia de pruebas
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Comprobar sintaxis y flujos simulados
        run: npm test
